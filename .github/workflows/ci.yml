name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret-key
      DEMO_CHECKOUT: "True"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: System checks
        run: python manage.py check --fail-level WARNING 2>&1 | tee ci.log
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run 2>&1 | tee ci.log
      - name: Run tests
        run: python manage.py test --verbosity 2 2>&1 | tee ci.log
      - name: Seed demo data (smoke test)
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo 2>&1 | tee ci.log
      - name: Surface failure output as annotations
        if: failure()
        run: |
          tail -n 25 ci.log | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=CI output::${line//%/%25}"
          done
