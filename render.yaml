# Render Blueprint — https://render.com/docs/blueprint-spec
# One free web service. The demo uses SQLite, which is rebuilt and re-seeded on each
# deploy/restart (a self-resetting demo). Set DATABASE_URL to a Postgres database to persist data.
services:
  - type: web
    name: carhub
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo --if-empty && python manage.py ensure_admin && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DEMO_CHECKOUT
        value: "True"
      - key: SHOW_DEMO_LOGINS
        value: "True"
      - key: CHAT_WEBSOCKETS
        value: "True"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Email for one-time codes and order updates (Gmail address + 16-character app password).
      # If Render blocks SMTP on your plan, set BREVO_API_KEY instead.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      # Your admin login for /staff/ and /admin/ (re-created on every deploy).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
