{% extends 'cas/base.html' %}
{% block title %}Upload Accessory{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-primary text-white rounded-top-4">
                    <h3 class="mb-0">Upload Product</h3>
                </div>
                <div class="card-body">
                    {% if success %}
                        <div class="alert alert-success">Accessory uploaded successfully!</div>
                    {% endif %}
                    {% if error_message %}
                        <div class="alert alert-danger">{{ error_message }}</div>
                    {% endif %}
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="mt-2"><button class="trodo-cta">Upload</button></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
